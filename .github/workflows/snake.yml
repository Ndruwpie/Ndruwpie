name: Generate Contribution Snake
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#be185d&color_dots=#161b22,#500724,#831843,#be185d,#ec4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#be185d&color_dots=#161b22,#500724,#831843,#be185d,#ec4899
      - name: Add dark background to SVGs
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path('dist').glob('*.svg'):
              svg = path.read_text(encoding='utf-8')
              root = ET.fromstring(svg)
              x, y, width, height = root.attrib['viewBox'].split()
              background = f'<rect x="{x}" y="{y}" width="{width}" height="{height}" fill="#0d1117"/>'
              position = svg.index('>', svg.index('<svg')) + 1
              path.write_text(svg[:position] + background + svg[position:], encoding='utf-8')
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
