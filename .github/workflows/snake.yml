name: Generate Contribution Snake
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#be185d&color_dots=#fce7f3,#fbcfe8,#f9a8d4,#f472b6,#ec4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#be185d&color_dots=#fce7f3,#fbcfe8,#f9a8d4,#f472b6,#ec4899
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
